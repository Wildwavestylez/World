let currentIndex = 0;
let polygonPoints;

if (savedPolygon) {

} else {

        [center[0] + 0.002, center[1] - 0.002],

        // Populace z připravených WorldPop rastrů (2020, přibližně 100 m).
        // Načítají se pouze archivy zemí, které zasahují do aktuálního polygonu.
        const POPULATION_RELEASE = "https://github.com/Wildwavestylez/World/releases/download/population-data-2020/";
        const POPULATION_REFRESH_MS = 60000;
        let populationRequestInFlight = false;
        let lastPopulationRequestAt = 0;
        let populationManifestPromise = null;
        const populationCountryArchives = new Map();
        let populationApiAvailable = true;


function isConnected(segmentA, segmentB) {
    let lastPointA = segmentA.coordinates[segmentA.coordinates.length - 1];
    let firstPointB = segmentB.coordinates[0];

    return distance(lastPointA, firstPointB) < 0.001; // Menší než 100m
}

// Výpočet vzdálenosti dvou bodů
function distance(coord1, coord2) {
    let latDiff = coord1[0] - coord2[0];
    let lonDiff = coord1[1] - coord2[1];
    return Math.sqrt(latDiff * latDiff + lonDiff * lonDiff);
}

        function getCentroid(points) {
            let latSum = 0, lngSum = 0;
            points.forEach(p => { latSum += p[0]; lngSum += p[1]; });
            return [latSum / points.length, lngSum / points.length];
        }

        function movePointAway(point, center, distance, index) {
    let prev = polygonPoints[(index - 1 + polygonPoints.length) % polygonPoints.length];
    let next = polygonPoints[(index + 1) % polygonPoints.length];

    // Vektor tangenty (hranové směry)
    let dx = next[1] - prev[1];
    let dy = next[0] - prev[0];

    // Normála (kolmice) – směr od polygonu ven
    let nx = -dy;
    let ny = dx;

    // Normalizace
    let length = Math.sqrt(nx * nx + ny * ny);
    nx /= length;
    ny /= length;

    // Náhodná odchylka ±30° → celkem 60°
    let angleOffset = (Math.random() - 0.5) * (Math.PI / 3); // ±30°
    let cosA = Math.cos(angleOffset);
    let sinA = Math.sin(angleOffset);

    let rotatedNx = nx * cosA - ny * sinA;
    let rotatedNy = nx * sinA + ny * cosA;

    return [
        point[0] + rotatedNy * distance, // latitude
        point[1] + rotatedNx * distance  // longitude
    ];
}


        function calculatePolygonArea(points) {
            let earthRadius = 6371; // Poloměr Země v km
            let area = 0;
            let n = points.length;

            for (let i = 0; i < n; i++) {
                let p1 = points[i];
                let p2 = points[(i + 1) % n];

                let lat1 = p1[0] * Math.PI / 180;
                let lon1 = p1[1] * Math.PI / 180;
                let lat2 = p2[0] * Math.PI / 180;
                let lon2 = p2[1] * Math.PI / 180;

                area += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
            }

            area = Math.abs(area * earthRadius * earthRadius / 2);
            return area;
        }

        let turn = 0; // Přidáme proměnnou pro sledování počtu tahů


function isPointInPolygon(point, polygon) {
    let x = point[1], y = point[0];
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        let xi = polygon[i][1], yi = polygon[i][0];
        let xj = polygon[j][1], yj = polygon[j][0];
        let intersect = ((yi > y) != (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}




// Pomocná funkce: výpočet vzdálenosti
function distanceBetween(p1, p2) {
    let latDiff = p2[0] - p1[0];
    let lngDiff = p2[1] - p1[1];
    return Math.sqrt(latDiff * latDiff + lngDiff * lngDiff);
}

// Výpočet konvexního obalu (Graham Scan / Jarvis March zjednodušený)
function getConvexHull(points) {
    points = points.slice(); // kopie
    points.sort((a, b) => a[1] === b[1] ? a[0] - b[0] : a[1] - b[1]); // podle x, pak y

    function cross(o, a, b) {
        return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    }

    let lower = [];
    for (let p of points) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
            lower.pop();
        }
        lower.push(p);
    }

    let upper = [];
    for (let i = points.length - 1; i >= 0; i--) {
        let p = points[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
            upper.pop();
        }
        upper.push(p);
    }

    upper.pop();
    lower.pop();
    return lower.concat(upper);
}

function isOnConvexHull(point, hull) {
    return hull.some(p => Math.abs(p[0] - point[0]) < 1e-8 && Math.abs(p[1] - point[1]) < 1e-8);
}

// Silnější pohyb směrem od středu
function forcePointOutward(point, center, distance) {
    let dx = point[0] - center[0];
    let dy = point[1] - center[1];
    let length = Math.sqrt(dx * dx + dy * dy) || 1;
    return [
        point[0] + (dx / length) * distance * 1.5,
        point[1] + (dy / length) * distance * 1.5
    ];
}
    
    
    
    const directionalSectors = [
    { name: "Sever", from: 345, to: 15 },
    { name: "Severovýchod", from: 15, to: 75 },
    { name: "Východ", from: 75, to: 105 },
    { name: "Jihovýchod", from: 105, to: 165 },
    { name: "Jih", from: 165, to: 195 },
    { name: "Jihozápad", from: 195, to: 255 },
    { name: "Západ", from: 255, to: 285 },
    { name: "Severozápad", from: 285, to: 345 }
];

const stepsPerSector = 200;
let currentSectorIndex = 0;
let lastSectorChangeTurn = 0;

let sectorQueue = shuffleArray([...directionalSectors]);

function shuffleArray(array) {
    return array
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ value }) => value);
}
    
    function getAngleDegrees(center, point) {
    let dx = point[1] - center[1];
    let dy = point[0] - center[0];
    let angleRad = Math.atan2(dx, dy); // Pozor na přehození dx/dy
    let angleDeg = angleRad * 180 / Math.PI;
    if (angleDeg < 0) angleDeg += 360;
    return angleDeg;
}

function isInSector(angle, sector) {
    if (sector.from < sector.to) {
        return angle >= sector.from && angle <= sector.to;
    } else {
        // Přesahuje přes 0°
        return angle >= sector.from || angle <= sector.to;
    }
}

// Směrový růst státu: první fáze je téměř rovnoměrná,
// po 500 tazích se aktivují dlouhodobé rychlosti jednotlivých světových směrů.
const BALANCED_GROWTH_TURNS = 500;
const growthProfile = {
    north: 1.0,
    east: 1.3,
    south: 0.5,
    west: 1.0
};
let dominantGrowthDirection = "east";
let growthDirectionInitialized = false;
let localGrowthNoise = {};

function projectPolygon(points) {
    const lat0 = points.reduce((sum, p) => sum + p[0], 0) / points.length;
    const cosLat = Math.cos(lat0 * Math.PI / 180);
    return {
        cosLat,
        points: points.map(p => ({ x: p[1] * 111320 * cosLat, y: p[0] * 110540 }))
    };
}

function unprojectPoint(p, cosLat) {
    return [p.y / 110540, p.x / (111320 * cosLat)];
}

function polygonSignedArea(points) {
    let sum = 0;
    for (let i = 0; i < points.length; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        sum += a.x * b.y - b.x * a.y;
    }
    return sum / 2;
}

function segmentsIntersect(a, b, c, d) {
    const cross = (p, q, r) => (q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
    const eps = 1e-7;
    const ab1=cross(a,b,c), ab2=cross(a,b,d), cd1=cross(c,d,a), cd2=cross(c,d,b);
    return ((ab1>eps&&ab2< -eps)||(ab1< -eps&&ab2>eps)) &&
           ((cd1>eps&&cd2< -eps)||(cd1< -eps&&cd2>eps));
}

function hasSelfIntersections(points) {
    const n=points.length;
    for(let i=0;i<n;i++){
        const a=points[i], b=points[(i+1)%n];
        for(let j=i+1;j<n;j++){
            if(j===i||j===i+1||(i===0&&j===n-1)) continue;
            if(segmentsIntersect(a,b,points[j],points[(j+1)%n])) return true;
        }
    }
    return false;
}

function splitLongEdges(points, maxLength=420) {
    const out=[];
    for(let i=0;i<points.length;i++){
        const a=points[i], b=points[(i+1)%points.length];
        out.push(a);
        const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
        const pieces=Math.min(8,Math.floor(len/maxLength));
        for(let j=1;j<=pieces;j++){
            const t=j/(pieces+1);
            out.push({x:a.x+dx*t,y:a.y+dy*t});
        }
    }
    return out;
}

function smoothBoundary(points, strength=0.07) {
    const n=points.length;
    return points.map((p,i)=>{
        const prev=points[(i-1+n)%n], next=points[(i+1)%n];
        return {x:p.x+((prev.x+next.x)/2-p.x)*strength,
                y:p.y+((prev.y+next.y)/2-p.y)*strength};
    });
}

function getDirectionalGrowthMultiplier(angleDegrees, balanced) {
    if (balanced) return 1 + (Math.random()-0.5)*0.12;

    // Hladké přechody mezi světovými směry; žádné ostré sektory.
    const angle=angleDegrees*Math.PI/180;
    const north=Math.cos(angle), east=Math.sin(angle);
    const south=Math.max(0,-north), northPart=Math.max(0,north);
    const eastPart=Math.max(0,east), westPart=Math.max(0,-east);

    let multiplier =
        northPart*growthProfile.north +
        eastPart*growthProfile.east +
        south*growthProfile.south +
        westPart*growthProfile.west;

    // Dominantní směr získá dodatečnou, plynule váženou výhodu.
    const dominantAngles={north:0,east:90,south:180,west:270};
    let delta=Math.abs(angleDegrees-dominantAngles[dominantGrowthDirection]);
    delta=Math.min(delta,360-delta);
    const dominantWeight=Math.max(0,Math.cos(delta*Math.PI/180));
    multiplier += dominantWeight*0.12;

    // Proměnlivý západní freestyle: drobné odchylky, nikdy obří skoky.
    const westWeight=westPart;
    multiplier += (Math.random()-0.5)*0.20*(0.35+westWeight);
    return Math.max(0.45,Math.min(1.55,multiplier));
}

function expandPolygon() {
    turn++;

    if (turn-turnLastSectorChangeFallback() >= stepsPerSector) {
        currentSectorIndex++;
        if(currentSectorIndex>=sectorQueue.length){
            sectorQueue=shuffleArray([...directionalSectors]);
            currentSectorIndex=0;
        }
        lastSectorChangeTurn=turn;
        console.log("🧭 Preferovaný lokální směr:",sectorQueue[currentSectorIndex].name);
    }

    if(turn>=BALANCED_GROWTH_TURNS && !growthDirectionInitialized){
        // Pro první verzi je hlavní směr východ; profil jde později snadno změnit.
        dominantGrowthDirection="east";
        growthDirectionInitialized=true;
        console.log("🌍 Aktivován směrový růst:",dominantGrowthDirection);
    }

    if(polygonPoints.length<4) return;
    const {cosLat,points:original}=projectPolygon(polygonPoints);
    const n=original.length;
    const oldArea=polygonSignedArea(original);
    const orientation=oldArea>=0?1:-1;
    const center={x:original.reduce((s,p)=>s+p.x,0)/n,
                  y:original.reduce((s,p)=>s+p.y,0)/n};
    const balanced=turn<BALANCED_GROWTH_TURNS;
    const index=currentIndex%n;
    const prev=original[(index-1+n)%n], point=original[index], next=original[(index+1)%n];

    function outwardNormal(a,b){
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
        return {x:orientation*dy/len,y:-orientation*dx/len};
    }
    const np=outwardNormal(prev,point), nn=outwardNormal(point,next);
    let nx=np.x+nn.x, ny=np.y+nn.y, nl=Math.hypot(nx,ny);
    if(nl<0.15){nx=point.x-center.x;ny=point.y-center.y;nl=Math.hypot(nx,ny)||1;}
    nx/=nl;ny/=nl;

    // Určíme zeměpisný směr od středu k bodu: sever = 0°, východ = 90°.
    const angle=Math.atan2(point.x-center.x,point.y-center.y)*180/Math.PI;
    const normalizedAngle=(angle+360)%360;
    const multiplier=getDirectionalGrowthMultiplier(normalizedAngle,balanced);

    // Lokální růstová paměť mění tempo postupně, takže nevznikají ostré zuby.
    const key=String(index);
    const previousNoise=localGrowthNoise[key]||1;
    const noiseTarget=0.88+Math.random()*0.24;
    const localNoise=previousNoise*0.82+noiseTarget*0.18;
    localGrowthNoise[key]=localNoise;

    const baseStep=8+Math.random()*4;
    const pulse=Math.random()<0.07?(1.12+Math.random()*0.18):1;
    const distance=baseStep*multiplier*localNoise*pulse;
    const candidate=original.map(p=>({x:p.x,y:p.y}));
    candidate[index]={x:point.x+nx*distance,y:point.y+ny*distance};

    let accepted=!hasSelfIntersections(candidate) &&
        Math.abs(polygonSignedArea(candidate))>Math.abs(oldArea);
    if(!accepted){
        candidate[index]={x:point.x+nx*distance*0.45,y:point.y+ny*distance*0.45};
        accepted=!hasSelfIntersections(candidate) &&
            Math.abs(polygonSignedArea(candidate))>Math.abs(oldArea);
    }

    if(accepted){
        let working=candidate;
        if(turn%12===0){
            working=splitLongEdges(working,420);
            const smoothed=smoothBoundary(working,0.07);
            if(!hasSelfIntersections(smoothed) &&
               Math.abs(polygonSignedArea(smoothed))>=Math.abs(polygonSignedArea(working))){
                working=smoothed;
            }
        }
        polygonPoints=working.map(p=>unprojectPoint(p,cosLat));
        polygon.setLatLngs(polygonPoints);
        const area=calculatePolygonArea(polygonPoints);
        document.getElementById("area").textContent=area.toFixed(2);
        // Populační dotaz je oddělený od animační smyčky; neblokuje růst polygonu.
        localStorage.setItem("polygonPoints",JSON.stringify(polygonPoints));
    }
    currentIndex=(index+1)%polygonPoints.length;
}

// Přepočítá celkovou populaci uvnitř polygonu z populačních buněk.
 // Hodnoty jsou počty osob na buňku, ne hustota. Každá původní buňka se
 // v jednom výpočtu započítá nejvýše jednou, i když se dlaždice překrývají.
 async function refreshPopulationEstimate(force = false) {
     const now = Date.now();
     if (!populationApiAvailable || populationRequestInFlight) return;
     if (!force && now - lastPopulationRequestAt < POPULATION_REFRESH_MS) return;
     if (!Array.isArray(polygonPoints) || polygonPoints.length < 3) return;

     lastPopulationRequestAt = now;
     populationRequestInFlight = true;
     const output = document.getElementById("population");
     const statusOutput = document.getElementById("populationStatus");
     output.textContent = "…";
     statusOutput.textContent = "Populace: stahuji manifest…";
     output.title = "Načítám populační data WorldPop (2020)…";

     try {
         if (!("DecompressionStream" in window)) {
             throw new Error("Prohlížeč nepodporuje rozbalení gzip dat.");
         }
         if (!window.JSZip) throw new Error("Knihovna pro ZIP není načtená.");
         if (!populationManifestPromise) {
             populationManifestPromise = fetch(POPULATION_RELEASE + "manifest.json", { cache: "no-store" })
                 .then(response => {
                     if (!response.ok) throw new Error("Manifest HTTP " + response.status);
                     return response.json();
                 });
         }
         const manifest = await populationManifestPromise;
         const latitudes = polygonPoints.map(p => p[0]);
         const longitudes = polygonPoints.map(p => p[1]);
         const bounds = {
             south: Math.min(...latitudes), north: Math.max(...latitudes),
             west: Math.min(...longitudes), east: Math.max(...longitudes)
         };
         statusOutput.textContent = "Populace: manifest načten, hledám dlaždice…";
         const countries = Object.entries(manifest.countries || {}).filter(([code, country]) =>
             (country.tiles || []).some(tile => {
                 const south = tile.north + tile.height * tile.pixelHeight;
                 const east = tile.west + tile.width * tile.pixelWidth;
                 return tile.west <= bounds.east && east >= bounds.west &&
                        south <= bounds.north && tile.north >= bounds.south;
             })
         );

         if (countries.length === 0) {
             throw new Error("Manifest načten, ale pro aktuální oblast nebyla nalezena žádná populační dlaždice.");
         }

         statusOutput.textContent = "Populace: nalezeno " + countries.length + " oblastí, načítám rastry…";
         let totalPopulation = 0;
         let scannedCells = 0;
         const countedCells = new Set();

         for (const [code, country] of countries) {
             let archivePromise = populationCountryArchives.get(code);
             if (!archivePromise) {
                 const archiveName = ({cz:"cz.zip",de:"de.zip",at:"at.zip"})[code];
                 if (!archiveName) continue;
                 archivePromise = fetch(POPULATION_RELEASE + archiveName, { cache: "no-store" })
                     .then(response => {
                         if (!response.ok) throw new Error(archiveName + " HTTP " + response.status);
                         return response.arrayBuffer();
                     })
                     .then(buffer => JSZip.loadAsync(buffer));
                 populationCountryArchives.set(code, archivePromise);
             }
             const archive = await archivePromise;
             for (const tile of country.tiles || []) {
                 const south = tile.north + tile.height * tile.pixelHeight;
                 const east = tile.west + tile.width * tile.pixelWidth;
                 if (tile.west > bounds.east || east < bounds.west ||
                     south > bounds.north || tile.north < bounds.south) continue;

                 const entry = archive.file(tile.file);
                 if (!entry) continue;
                 const gzBytes = await entry.async("uint8array");
                 const rawStream = new Blob([gzBytes]).stream().pipeThrough(new DecompressionStream("gzip"));
                 const rawBuffer = await new Response(rawStream).arrayBuffer();
                 const values = new Float32Array(rawBuffer);
                 const expected = tile.width * tile.height;
                 if (values.length < expected) {
                     console.warn("Neúplná populační dlaždice:", tile.file);
                     continue;
                 }

                 for (let row = 0; row < tile.height; row++) {
                     const lat = tile.north + (row + 0.5) * tile.pixelHeight;
                     if (lat < bounds.south || lat > bounds.north) continue;
                     for (let col = 0; col < tile.width; col++) {
                         const lng = tile.west + (col + 0.5) * tile.pixelWidth;
                         if (lng < bounds.west || lng > bounds.east) continue;
                         const value = values[row * tile.width + col];
                         if (!Number.isFinite(value) || value < 0) continue;

                         const cellId = country.iso3 + ":" +
                             (tile.sourceRowOffset + row) + ":" +
                             (tile.sourceColOffset + col);
                         if (countedCells.has(cellId)) continue;
                         countedCells.add(cellId);
                         if (isPointInPolygon([lat, lng], polygonPoints)) {
                             totalPopulation += value;
                             scannedCells++;
                         }
                     }
                 }
                 // Předání řízení prohlížeči mezi dlaždicemi, aby růst mapy zůstal plynulý.
                 await new Promise(resolve => setTimeout(resolve, 0));
             }
         }

         if (scannedCells === 0) {
             throw new Error("Dlaždice se načetly, ale uvnitř polygonu nebyly nalezeny žádné platné buňky.");
         }
         output.textContent = Math.round(totalPopulation).toLocaleString("cs-CZ");
         statusOutput.textContent = "Populace OK: " + scannedCells.toLocaleString("cs-CZ") + " buněk.";
         output.title = "WorldPop 2020, přibližně 100 m. Započteno " +
             scannedCells.toLocaleString("cs-CZ") + " populačních buněk; výsledek se obnovuje přibližně každou minutu.";
     } catch (error) {
         console.warn("Populační data se nepodařilo načíst:", error);
         output.textContent = "—";
         const message = "CHYBA POPULACE: " + error.message;
         statusOutput.textContent = message;
         statusOutput.style.color = "#b00020";
         output.title = message;
     } finally {
         populationRequestInFlight = false;
     }
}

function turnLastSectorChangeFallback() {
    return typeof lastSectorChangeTurn==="number"?lastSectorChangeTurn:0;
}

function unlockBlockedPoints() {
            let currentTime = Date.now();
            for (let index in blockedPoints) {
                if (currentTime >= blockedPoints[index]) {
                    delete blockedPoints[index];
                }
            }
        }

        // Populace se načítá samostatně; herní růst zůstává na původních 400 ms.
        setTimeout(() => refreshPopulationEstimate(true), 3000);
        setInterval(() => refreshPopulationEstimate(false), POPULATION_REFRESH_MS);

        setInterval(() => {
            expandPolygon();
            unlockBlockedPoints();
        }, 400);


function clearLocalStorage() {
    // Tlačítko se jmenuje „Vymazat LocalStorage“, proto opravdu vymaže
    // celé lokální úložiště této hry, ne pouze uložený polygon.
    localStorage.clear();
    location.reload(); // Načte hru s výchozím polygonem
}



    </script>
