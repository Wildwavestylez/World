<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostrava Tram-Train Simulator Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #fff; overflow: hidden; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        #top-bar {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center; pointer-events: none;
        }

        .hud-card {
            background: rgba(17, 17, 22, 0.9); backdrop-filter: blur(8px);
            padding: 10px 18px; border-radius: 8px; border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; font-weight: bold;
            display: flex; gap: 10px; align-items: center;
        }

        #balance-box { color: #2ecc71; font-size: 16px; }

        #hamburger-btn {
            background: #2a2a35; color: #fff; border: 1px solid #444;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 20px;
            pointer-events: auto; transition: background 0.2s;
        }
        #hamburger-btn:hover { background: #3a3a48; }

        #sidebar {
            position: absolute; top: 0; left: -380px; width: 370px; height: 100vh;
            background: rgba(24, 24, 29, 0.95); backdrop-filter: blur(10px); z-index: 1001;
            padding: 20px; box-shadow: 5px 0 25px rgba(0,0,0,0.7);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
        }

        #sidebar.open { left: 0; }

        .close-btn { align-self: flex-end; background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        .tab-nav { display: flex; gap: 5px; background: #111116; padding: 5px; border-radius: 6px; }
        .tab-btn { flex: 1; padding: 8px; background: none; border: none; color: #888; cursor: pointer; font-weight: 600; font-size: 11px; border-radius: 4px; }
        .tab-btn.active { background: #2a2a35; color: #fff; }

        .tab-content { display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }

        .tool-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 12px; background: #2a2a35; color: #fff;
            border: 2px solid transparent; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600;
        }
        .tool-btn:hover { background: #3a3a48; }
        .tool-btn.active { border-color: #3498db; background: #1f3a52; }

        .undo-btn {
            background: #e67e22; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
            display: none; transition: background 0.2s;
        }
        .undo-btn:hover { background: #d35400; }

        .price-tag { font-size: 11px; color: #f1c40f; }

        .item-card { background: #22222a; padding: 12px; border-radius: 6px; border: 1px solid #333; display: flex; flex-direction: column; gap: 6px; }
        .action-btn { background: #27ae60; color: #fff; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background: #2ecc71; }
        .danger-btn { background: #c0392b; color: #fff; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .danger-btn:hover { background: #e74c3c; }

        .stop-marker { background: #e74c3c; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 8px rgba(0,0,0,0.8); cursor: pointer; }
        
        .train-img-marker {
            width: 40px; height: 24px; border-radius: 4px; object-fit: cover;
            border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: #000; cursor: pointer;
        }

        .track-node { background: #ffffff; width: 6px; height: 6px; border-radius: 50%; border: 1px solid #000; }
        .hidden-node { display: none !important; }

/* Posuvník pro popup okna vlaků a stanic */
.passenger-scroll-list {
    max-height: 180px; /* cca 8-10 řádků */
    overflow-y: auto;
    margin-top: 5px;
    padding-right: 5px;
}

/* Jemné přizpůsobení posuvníku pro moderní vzhled */
.passenger-scroll-list::-webkit-scrollbar {
    width: 5px;
}
.passenger-scroll-list::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 3px;
}


        .passenger-float-info {
            background: rgba(0, 0, 0, 0.85);
            color: #2ecc71;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #2ecc71;
            white-space: nowrap;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        .save-controls { display: flex; gap: 5px; margin-top: auto; padding-top: 10px; border-top: 1px solid #333; }
        .save-btn { flex: 1; padding: 8px; font-size: 11px; background: #34495e; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .save-btn:hover { background: #4e6d8c; }
    </style>
</head>
<body>

    <div id="top-bar">
        <button id="hamburger-btn" onclick="toggleSidebar()">☰ Menu</button>
        <div class="hud-card">🚆 Tram-Train Ostrava</div>
        <div class="hud-card" id="balance-box">350 000 000 Kč</div>
    </div>

    <div id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">✕</button>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('build')">🔨 Stavba</button>
            <button class="tab-btn" onclick="switchTab('fleet')">DEP DEPO</button>
            <button class="tab-btn" onclick="switchTab('lines')">🗺️ Linky</button>
        </div>

        <div id="tab-build" class="tab-content active">
            <button class="tool-btn active" id="btn-select" onclick="setMode('select')">🖐️ Prohlížení</button>
            <button class="tool-btn" id="btn-track" onclick="setMode('track')">🛤️ Koleje <span class="price-tag">15M / km</span></button>
            <button class="tool-btn" id="btn-tunnel" onclick="setMode('tunnel')">🚇 Tunel <span class="price-tag">80M / km</span></button>
            <button class="tool-btn" id="btn-stop" onclick="setMode('stop')">🚏 Zastávka <span class="price-tag">5M Kč</span></button>
            <button class="tool-btn" id="btn-demolish" onclick="setMode('demolish')">🗑️ Zbourat kolej <span class="price-tag">Vrátí 50%</span></button>
            
            <button id="btn-undo-track" class="undo-btn" onclick="undoLastTrack()">↩️ Zpět (poslední kolej)</button>
            <button id="btn-undo-stop" class="undo-btn" onclick="undoLastStop()">↩️ Zpět (poslední zastávka)</button>
        </div>

        <div id="tab-fleet" class="tab-content">
            <h4>Koupit nové vozidlo:</h4>
            <div id="vehicle-shop"></div>
            <h4>Vlastněná vozidla (<span id="train-count">0</span>):</h4>
            <div id="owned-trains-list"></div>
        </div>

        <div id="tab-lines" class="tab-content">
            <button class="action-btn" style="background:#3498db;" onclick="startLineCreation()">➕ Vytvořit novou linku</button>
            <div id="line-creation-info" style="display:none; font-size:12px; color:#f1c40f; background:#222; padding:8px; border-radius:4px;">
                Klikáním na zastávky vytvoř trasu.
                <button class="action-btn" style="margin-top:5px;" onclick="finishLineCreation()">Dokončit linku</button>
            </div>
            <h4>Aktivní linky:</h4>
            <div id="lines-list"></div>
        </div>

        <div class="save-controls">
            <button class="save-btn" onclick="saveGame()">💾 Uložit</button>
            <button class="save-btn" onclick="loadGame()">📂 Načíst</button>
            <button class="save-btn" style="background:#c0392b;" onclick="resetGame()">🗑️ Reset</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const LINE_COLORS = ['#3498db', '#2ecc71', '#e74c3c', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#fd79a8'];
        
        const VEHICLE_TYPES = [
            { id: 'citylink', name: 'Stadler Citylink', speed: 80, capacity: 120, price: 12000000, img: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=100&auto=format&fit=crop&q=60' },
            { id: 't3', name: 'Tatra T3R.EV / Trio', speed: 60, capacity: 75, price: 4500000, img: 'https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=100&auto=format&fit=crop&q=60' },
            { id: 'panter', name: 'RegioPanter', speed: 120, capacity: 200, price: 18000000, img: 'https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=100&auto=format&fit=crop&q=60' }
        ];

        const map = L.map('map', { zoomControl: false }).setView([49.8355, 18.2923], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let balance = 350000000;
        let currentMode = 'select';
        let trackStartPoint = null;
        let tempStartMarker = null;

        const COST_TRACK_KM = 1500000;
        const COST_TUNNEL_KM = 8000000;
        const COST_STOP = 500000;
        const SNAP_RADIUS_METERS = 30;

        let stops = [];
        let trains = [];
        let lines = [];
        let nodes = []; 
        let trackSegments = [];
        let tempLineStops = [];
        let isCreatingLine = false;

        let extendingLine = null;
        let extendPosition = null; 

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function setMode(mode) {
            currentMode = mode;
            if (tempStartMarker) { map.removeLayer(tempStartMarker); tempStartMarker = null; }
            trackStartPoint = null;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            // Zobrazení tlačítka Undo podle vybraného nástroje
            document.getElementById('btn-undo-track').style.display = (mode === 'track' || mode === 'tunnel') ? 'block' : 'none';
            document.getElementById('btn-undo-stop').style.display = (mode === 'stop') ? 'block' : 'none';

            let nodeElements = document.querySelectorAll('.track-node');
            nodeElements.forEach(el => {
                if (currentMode === 'select') {
                    el.classList.add('hidden-node');
                } else {
                    el.classList.remove('hidden-node');
                }
            });
        }

        function getSnappedLatLng(latlng) {
            let closestPoint = latlng;
            let minDistance = SNAP_RADIUS_METERS;

            nodes.forEach(node => {
                let dist = map.distance(latlng, node);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestPoint = node;
                }
            });

            stops.forEach(stop => {
                let dist = map.distance(latlng, stop.latlng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestPoint = stop.latlng;
                }
            });

            return closestPoint;
        }

        map.on('click', function(e) {
            let snappedLatLng = getSnappedLatLng(e.latlng);

            if (currentMode === 'track' || currentMode === 'tunnel') {
                handleLineBuilding(snappedLatLng, currentMode === 'tunnel');
            } else if (currentMode === 'stop') {
                buildStop(snappedLatLng);
            }
        });

        function addNodeMarker(latlng) {
            let exists = nodes.some(n => map.distance(n, latlng) < 1);
            if (!exists) {
                nodes.push(latlng);
                let isHidden = currentMode === 'select' ? 'hidden-node' : '';
                L.marker(latlng, {
                    icon: L.divIcon({ className: `track-node ${isHidden}` }),
                    interactive: false
                }).addTo(map);
            }
        }

        function handleLineBuilding(latlng, isTunnel) {
            if (!trackStartPoint) {
                trackStartPoint = latlng;
                tempStartMarker = L.circleMarker(latlng, { color: isTunnel ? '#9b59b6' : '#3498db', radius: 5 }).addTo(map);
            } else {
                let distKm = (map.distance(trackStartPoint, latlng)) / 1000;
                let cost = Math.round(distKm * (isTunnel ? COST_TUNNEL_KM : COST_TRACK_KM));

                if (balance < cost) {
                    alert("Nedostatek financí!");
                    if (tempStartMarker) map.removeLayer(tempStartMarker);
                    trackStartPoint = null;
                    return;
                }

                balance -= cost;
                
                let polyline = L.polyline([trackStartPoint, latlng], {
                    color: isTunnel ? '#9b59b6' : '#3498db',
                    weight: isTunnel ? 4 : 5,
                    dashArray: isTunnel ? '6, 6' : null
                }).addTo(map);

                let segmentObj = { id: Date.now(), start: trackStartPoint, end: latlng, polyline: polyline, isTunnel: isTunnel, cost: cost };
                trackSegments.push(segmentObj);

                polyline.on('click', () => {
                    if (currentMode === 'demolish') {
                        demolishSegment(segmentObj);
                    }
                });

                addNodeMarker(trackStartPoint);
                addNodeMarker(latlng);

                if (tempStartMarker) map.removeLayer(tempStartMarker);
                trackStartPoint = null;
                autoSave();
                updateUI();
            }
        }

        function undoLastTrack() {
            if (trackSegments.length === 0) return alert("Žádná postavená kolej ke zrušení!");
            let lastSeg = trackSegments.pop();
            map.removeLayer(lastSeg.polyline);
            balance += lastSeg.cost; // Vracíme 100% ceny
            autoSave();
            updateUI();
        }

        function demolishSegment(segment) {
            map.removeLayer(segment.polyline);
            trackSegments = trackSegments.filter(s => s.id !== segment.id);
            balance += Math.round(segment.cost * 0.5);
            alert("Úsek kolejí zbourán, vrací se 50% financí.");
            autoSave();
            updateUI();
        }

        function buildStop(latlng) {
            if (balance < COST_STOP) return alert("Nedostatek financí!");

            balance -= COST_STOP;
            let stopId = stops.length + 1;
            let stopName = prompt("Název zastávky:", `Stanice ${stopId}`) || `Stanice ${stopId}`;

            let marker = L.marker(latlng, {
                icon: L.divIcon({ className: 'stop-marker' })
            }).addTo(map);

            marker.bindPopup('');

            let stopObj = { 
                id: stopId, 
                name: stopName, 
                latlng: latlng, 
                marker: marker,
                passengers: {} 
            };

            stops.push(stopObj);

            marker.on('click', () => {
                if (isCreatingLine || extendingLine) {
                    marker.closePopup();
                    onStopClick(stopObj);
                } else {
                    updateStopPopup(stopObj);
                }
            });

            updateStopPopup(stopObj);
            autoSave();
            updateUI();
        }

        function undoLastStop() {
            if (stops.length === 0) return alert("Žádná zastávka ke zrušení!");
            let lastStop = stops.pop();
            map.removeLayer(lastStop.marker);
            balance += COST_STOP; // Vracíme 100% (5M)
            autoSave();
            updateUI();
        }

        // 1. INOVOVANÁ FUNKCE SE SCROLLBAREM A SEŘAZENÍM
function updateStopPopup(stopObj) {
    if (!stopObj.marker) return;

    let total = 0;
    let targetCounts = [];

    // Spočítáme a připravíme data
    for (let targetId in stopObj.passengers) {
        let count = stopObj.passengers[targetId];
        let targetStop = stops.find(s => s.id == targetId);
        
        if (targetStop && count > 0) {
            total += count;
            targetCounts.push({
                name: targetStop.name,
                count: count
            });
        }
    }

    // SEŘAZENÍ SESTUPNĚ (nejvíc lidí nahoře)
    targetCounts.sort((a, b) => b.count - a.count);

    // Sestavení HTML se scrollbarem
    let passHtml = '';
    if (targetCounts.length > 0) {
        passHtml = '<div class="passenger-scroll-list">';
        targetCounts.forEach(item => {
            passHtml += `➔ ${item.name}: <b>${item.count} lidí</b><br>`;
        });
        passHtml += '</div>';
    } else {
        passHtml = '<br><i style="color:#888;">Nástupiště je prázdné</i>';
    }

    let content = `
        <b>🚏 ${stopObj.name}</b><br>
        <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
        <span>Čeká celkem: <b>${total} cestujících</b></span>
        <span style="font-size:11px; color:#aaa;">${passHtml}</span>
    `;

    stopObj.marker.setPopupContent(content);
}

// 2. TVŮJ GENERÁTOR CESTUJÍCÍCH (Běží každých 8 sekund)
setInterval(() => {
    if (stops.length < 2) return;
    stops.forEach(stop => {
        let target = stops[Math.floor(Math.random() * stops.length)];
        if (target.id !== stop.id) {
            stop.passengers[target.id] = (stop.passengers[target.id] || 0) + Math.floor(Math.random() * 4) + 1;
            updateStopPopup(stop);
        }
    });
}, 8000);

        function buyTrain(typeId) {
            let vType = VEHICLE_TYPES.find(v => v.id === typeId);
            if (balance < vType.price) return alert("Nemáš dostatek peněz!");
            
            balance -= vType.price;
            let trainId = `${Math.floor(100 + Math.random() * 900)} ${Math.floor(100 + Math.random() * 900)}-${Math.floor(Math.random() * 9)}`;

            trains.push({ 
                id: trainId, 
                model: vType.name, 
                speed: vType.speed,
                capacity: vType.capacity,
                img: vType.img,
                assignedLine: null,
                distanceKm: 0,
                passengersOnBoard: [] 
            });

            autoSave();
            updateUI();
        }

        function startLineCreation() {
            isCreatingLine = true;
            extendingLine = null;
            tempLineStops = [];
            document.getElementById('line-creation-info').style.display = 'block';
            toggleSidebar();
        }

        function appendStopToLine(lineId, position) {
            extendingLine = lines.find(l => l.id === lineId);
            extendPosition = position;
            isCreatingLine = false;
            
            alert(`Klikni na zastávku na mapě, kterou chceš přidat na ${position === 'start' ? 'ZAČÁTEK' : 'KONEC'} linky ${extendingLine.name}.`);
            toggleSidebar();
        }

        function onStopClick(stopObj) {
            if (isCreatingLine) {
                tempLineStops.push(stopObj);
                alert(`Zastávka ${stopObj.name} přidána do nové linky.`);
                return;
            }

            if (extendingLine) {
                if (extendingLine.stops.some(s => s.id === stopObj.id)) {
                    alert("Tato zastávka už v lince je!");
                    return;
                }

                if (extendPosition === 'start') {
                    extendingLine.stops.unshift(stopObj);
                } else {
                    extendingLine.stops.push(stopObj);
                }

                extendingLine.path = buildPathFromStops(extendingLine.stops);
                redrawLinePolyline(extendingLine);

                alert(`Zastávka ${stopObj.name} byla úspěšně přidána!`);
                
                extendingLine = null;
                extendPosition = null;
                autoSave();
                updateUI();
            }
        }

        function buildPathFromStops(selectedStops) {
            let fullPath = [];
            for (let i = 0; i < selectedStops.length - 1; i++) {
                let startPt = selectedStops[i].latlng;
                let endPt = selectedStops[i+1].latlng;
                
                let segmentPath = findTrackPath(startPt, endPt);
                if (fullPath.length > 0 && segmentPath.length > 0) {
                    segmentPath.shift();
                }
                fullPath = fullPath.concat(segmentPath);
            }
            return fullPath;
        }

        function findTrackPath(startLatLng, endLatLng) {
            let queue = [[startLatLng]];
            let visited = [];

            while (queue.length > 0) {
                let path = queue.shift();
                let current = path[path.length - 1];

                if (map.distance(current, endLatLng) < 20) {
                    return path;
                }

                visited.push(current);

                let neighbors = [];
                trackSegments.forEach(seg => {
                    if (map.distance(seg.start, current) < 20) neighbors.push(seg.end);
                    if (map.distance(seg.end, current) < 20) neighbors.push(seg.start);
                });

                neighbors.forEach(neighbor => {
                    if (!visited.some(v => map.distance(v, neighbor) < 20)) {
                        queue.push([...path, neighbor]);
                    }
                });
            }

            return [startLatLng, endLatLng];
        }

        function finishLineCreation() {
            if (tempLineStops.length < 2) return alert("Linka musí mít alespoň 2 zastávky!");

            let lineId = lines.length + 1;
            let lineName = prompt("Název linky:", `Linka L${lineId}`) || `Linka L${lineId}`;
            let calculatedPath = buildPathFromStops(tempLineStops);
            let color = LINE_COLORS[(lines.length) % LINE_COLORS.length];

            let linePolyline = L.polyline(calculatedPath, { color: color, weight: 6, opacity: 0.8 }).addTo(map);

            lines.push({ 
                id: lineId, 
                name: lineName, 
                color: color,
                stops: [...tempLineStops], 
                path: calculatedPath,
                polyline: linePolyline,
                assignedTrains: [] 
            });
            
            isCreatingLine = false;
            document.getElementById('line-creation-info').style.display = 'none';
            autoSave();
            updateUI();
        }

        function redrawLinePolyline(line) {
            if (line.polyline) map.removeLayer(line.polyline);
            line.polyline = L.polyline(line.path, { color: line.color, weight: 6, opacity: 0.8 }).addTo(map);
        }

        function assignTrainToLine(trainId, lineId) {
            let train = trains.find(t => t.id === trainId);
            let line = lines.find(l => l.id === lineId);
            if (!train || !line) return;

            if (train.assignedLine) {
                let oldLine = lines.find(l => l.id === train.assignedLine);
                if (oldLine) {
                    oldLine.assignedTrains = oldLine.assignedTrains.filter(id => id !== train.id);
                }
            }

            train.assignedLine = line.id;
            line.assignedTrains.push(train.id);

            let trainMarker = L.marker(line.path[0], {
                icon: L.divIcon({ 
                    className: 'train-img-icon', 
                    html: `<img src="${train.img}" class="train-img-marker" style="border-color:${line.color};">` 
                })
            }).addTo(map);

            train.marker = trainMarker;
            trainMarker.bindPopup('');
            trainMarker.on('click', () => updateTrainPopup(train));

            let trainIndex = line.assignedTrains.length - 1;
            startTrainMovement(train, line, trainIndex);
            
            autoSave();
            updateUI();
        }

        function updateTrainPopup(train) {
    if (!train.marker) return;

    let passCount = train.passengersOnBoard.length;

    // 1. Spočítáme lidi podle cílových stanic
    let targetCounts = {};
    train.passengersOnBoard.forEach(p => {
        targetCounts[p.targetId] = (targetCounts[p.targetId] || 0) + 1;
    });

    // 2. Převod na pole a SEŘAZENÍ SESTUPNĚ (nejvíc lidí nahoře)
    let sortedTargets = Object.keys(targetCounts).map(targetId => {
        let targetStop = stops.find(s => s.id == targetId);
        return {
            name: targetStop ? targetStop.name : `Stanice ${targetId}`,
            count: targetCounts[targetId]
        };
    }).sort((a, b) => b.count - a.count);

    // 3. Generování HTML obsahu
    let passDetailsHtml = '';
    if (sortedTargets.length > 0) {
        passDetailsHtml = '<div class="passenger-scroll-list">';
        sortedTargets.forEach(item => {
            passDetailsHtml += `➔ ${item.name}: <b>${item.count} lidí</b><br>`;
        });
        passDetailsHtml += '</div>';
    } else {
        passDetailsHtml = '<br><i style="color:#888;">Vlak je prázdný</i>';
    }

    let content = `
        <b>🚆 Vozidlo ${train.id}</b><br>
        <span>Typ: <b>${train.model}</b></span><br>
        <span>Linka: <b>L${train.assignedLine}</b></span><br>
        <span>Najeto: <b>${train.distanceKm.toFixed(1)} km</b></span><br>
        <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
        <span>Obsazenost: <b>${passCount} / ${train.capacity} os.</b></span>
        <span style="font-size:11px; color:#aaa;">${passDetailsHtml}</span>
    `;

    train.marker.setPopupContent(content);
}



        function unassignTrain(trainId) {
            let train = trains.find(t => t.id === trainId);
            if (!train) return;

            if (train.assignedLine) {
                let oldLine = lines.find(l => l.id === train.assignedLine);
                if (oldLine) {
                    oldLine.assignedTrains = oldLine.assignedTrains.filter(id => id !== train.id);
                }
            }

            train.assignedLine = null;
            if (train.marker) map.removeLayer(train.marker);

            autoSave();
            updateUI();
        }

        function startTrainMovement(train, line, trainIndex) {
    let currentSegmentIndex = 0;
    let direction = 1;

    function initMovement() {
        let totalTrains = line.assignedTrains ? line.assignedTrains.length : 1;
        
        // FIX TAKTU: Pevný rozestup 15 sekund mezi výjezdy jednotlivých vlaků
        // 1. vlak (index 0) = 0s delay
        // 2. vlak (index 1) = 15s delay
        // 3. vlak (index 2) = 30s delay... atd.
        let delayMs = trainIndex * 15000; 

        // Pokud vlak už měl nějaký pohyb nebo načítáme pozici, ale chceme takt:
        setTimeout(() => {
            moveSegment();
        }, delayMs);
    }

    function moveSegment() {
        if (!train.assignedLine) return;

        let currentPath = line.path;

        if (currentSegmentIndex >= currentPath.length) {
            currentSegmentIndex = currentPath.length - 1;
        }

        let nextSegmentIndex = currentSegmentIndex + direction;

        // Pokud jsme na konci trati, otočíme směr
        if (nextSegmentIndex >= currentPath.length || nextSegmentIndex < 0) {
            direction *= -1;
            nextSegmentIndex = currentSegmentIndex + direction;
        }

        // Uložíme aktuální směr do objektu vlaku
        train.direction = direction;

        let startPt = currentPath[currentSegmentIndex];
        let targetPt = currentPath[nextSegmentIndex];

        let distanceMeters = map.distance(startPt, targetPt);
        let distanceKm = distanceMeters / 1000;
        train.distanceKm += distanceKm;

        let durationMs = ((distanceKm / train.speed) * 3600 * 1000) / 5;
        if (durationMs < 50) durationMs = 50;

        let startTime = Date.now();

        function animate() {
            if (!train.assignedLine) return;

            let elapsed = Date.now() - startTime;
            let progress = Math.min(elapsed / durationMs, 1);

            let currentLat = startPt.lat + (targetPt.lat - startPt.lat) * progress;
            let currentLng = startPt.lng + (targetPt.lng - startPt.lng) * progress;
            
            if (train.marker) train.marker.setLatLng([currentLat, currentLng]);

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentSegmentIndex = nextSegmentIndex;

                let currentStop = line.stops.find(stop => map.distance(stop.latlng, targetPt) < 20);

                if (currentStop) {
                    // Předáváme i 'direction' do obsluhy cestujících
                    handlePassengerBoarding(train, currentStop, line, direction);
                    setTimeout(moveSegment, 2000); // Stanicovací pauza 2 sekundy
                } else {
                    moveSegment();
                }
            }
        }

        requestAnimationFrame(animate);
    }

    initMovement();
}


function handlePassengerBoarding(train, stop, line, direction) {
    let remainingPassengers = [];
    let earnings = 0;
    let alightedCount = 0;

    let currentStopIndex = line.stops.findIndex(s => s.id == stop.id);
    if (currentStopIndex === -1) return;

    let effectiveDirection = direction;
    if (currentStopIndex === 0) {
        effectiveDirection = 1;
    } else if (currentStopIndex === line.stops.length - 1) {
        effectiveDirection = -1;
    }

    // Stanice, které leží POUZE A JENOM PŘED VLAKEM
    let upcomingStops = [];
    if (effectiveDirection === 1) {
        upcomingStops = line.stops.slice(currentStopIndex + 1);
    } else {
        upcomingStops = line.stops.slice(0, currentStopIndex);
    }
    let upcomingStopIds = upcomingStops.map(s => s.id);

    // 1. VÝSTUP A PŘESTUP
    train.passengersOnBoard.forEach(p => {
        if (p.targetId == stop.id) {
            earnings += 750;
            alightedCount++;
        } else {
            // Hledáme JINÉ linky vedoucí do cíle (ne naši vlastní)
            let otherTargetLines = lines.filter(l => l.id !== line.id && l.stops.some(s => s.id == p.targetId));
            let isTransferStation = otherTargetLines.some(tl => tl.stops.some(ts => ts.id == stop.id));

            let hasFutureOption = upcomingStopIds.some(upId => upId == p.targetId) || upcomingStops.some(myStop => 
                otherTargetLines.some(targetLine => targetLine.stops.some(ts => ts.id == myStop.id))
            );

            if (isTransferStation && !hasFutureOption) {
                stop.passengers[p.targetId] = (stop.passengers[p.targetId] || 0) + 1;
                alightedCount++;
            } else {
                remainingPassengers.push(p);
            }
        }
    });

    train.passengersOnBoard = remainingPassengers;
    balance += earnings;

    // 2. NÁSTUP (OPRAVENÁ LOGIKA BEZ SAMOPŘESTUPU)
    let boardedCount = 0;

    for (let targetId in stop.passengers) {
        let tId = parseInt(targetId);

        // A) Leží cíl přímo na naší lince?
        let isDirectTargetOnOurLine = line.stops.some(s => s.id == tId);
        
        // B) Pokud ne, existují JINÉ linky pro přestup?
        let otherTargetLines = lines.filter(l => l.id !== line.id && l.stops.some(s => s.id == tId));

        let validDropoffStopIds = [];

        if (isDirectTargetOnOurLine) {
            // Pokud cíl leží na naší lince, jediná platná stanice pro výstup je PŘÍMO TEN CÍL!
            validDropoffStopIds.push(tId);
        } else {
            // Pokud leží na jiné lince, platné stanice jsou křižovatky s těmito JINÝMI linkami
            line.stops.forEach(myStop => {
                let isTransferPoint = otherTargetLines.some(tl => tl.stops.some(ts => ts.id == myStop.id));
                if (isTransferPoint) validDropoffStopIds.push(myStop.id);
            });
        }

        // Nastoupí POUZE pokud je jeho cíl/přestup STRICTNĚ PŘED VLAKEM!
        let isAnyValidStopAhead = upcomingStopIds.some(aheadId => 
            validDropoffStopIds.some(validId => validId == aheadId)
        );

        if (isAnyValidStopAhead) {
            let waiting = stop.passengers[targetId];
            let space = train.capacity - train.passengersOnBoard.length;

            if (space > 0 && waiting > 0) {
                let boarding = Math.min(waiting, space);
                stop.passengers[targetId] -= boarding;
                boardedCount += boarding;

                for (let i = 0; i < boarding; i++) {
                    train.passengersOnBoard.push({ targetId: tId });
                }
            }
        }
    }

    if (boardedCount > 0 || alightedCount > 0) {
        showFloatingPassengerInfo(train.marker.getLatLng(), `+${boardedCount} 👥 / -${alightedCount} 👥`);
    }

    updateStopPopup(stop);
    updateTrainPopup(train);
    updateUI();
}

function distributeTrainsEvenlyOnLine(lineId) {
    let line = lines.find(l => l.id == lineId);
    let lineTrains = trains.filter(t => t.assignedLine == lineId);

    if (!line || lineTrains.length === 0) return;

    // Nastavíme interval mezi vlaky (např. 15 sekund mezi každým výjezdem)
    let intervalDelayMs = 15000; // 15 sekund (uprav si podle rychlosti tvých vlaků)

    lineTrains.forEach((train, index) => {
        // První vlak (index 0) má delay 0 a jede hned.
        // Další vlaky dostanou postupně větší zpoždění (15s, 30s, 45s...)
        train.startDelay = index * intervalDelayMs;
        
        // Všechny postavíme na startovní stanici
        train.currentStopIndex = 0;
        train.direction = 1;

        let startStop = line.stops[0];
        if (startStop && train.marker) {
            train.marker.setLatLng([startStop.lat, startStop.lng]);
        }
    });
}



        function showFloatingPassengerInfo(latlng, text) {
            let floatMarker = L.marker(latlng, {
                icon: L.divIcon({
                    className: 'passenger-float-info',
                    html: text
                }),
                interactive: false
            }).addTo(map);

            setTimeout(() => { map.removeLayer(floatMarker); }, 2000);
        }

        function updateUI() {
            document.getElementById('balance-box').innerText = `${balance.toLocaleString()} Kč`;
            document.getElementById('train-count').innerText = trains.length;

            let shopHtml = '';
            VEHICLE_TYPES.forEach(v => {
                shopHtml += `<div class="item-card">
                    <b>${v.name}</b>
                    <span style="font-size: 11px; color: #aaa;">Rychlost: ${v.speed} km/h | Kapacita: ${v.capacity} os.</span>
                    <span class="price-tag">${v.price.toLocaleString()} Kč</span>
                    <button class="action-btn" onclick="buyTrain('${v.id}')">Koupit vozidlo</button>
                </div>`;
            });
            document.getElementById('vehicle-shop').innerHTML = shopHtml;

            let fleetHtml = '';
            trains.forEach(t => {
                fleetHtml += `<div class="item-card">
                    <b>🚆 ${t.model} <span style="font-size:10px; color:#f1c40f;">(${t.id})</span></b>
                    <span style="font-size:11px; color:#aaa;">Tachometr: ${t.distanceKm.toFixed(1)} km</span>
                    <span style="font-size:11px; color:#aaa;">Obsazenost: ${t.passengersOnBoard.length} / ${t.capacity} os.</span>
                    <span style="font-size:11px; color:#aaa;">Stav: ${t.assignedLine ? `V provozu na L${t.assignedLine}` : 'V depu'}</span>
                    ${t.assignedLine ? `<button class="danger-btn" onclick="unassignTrain('${t.id}')">Stáhnout do depa</button>` : ''}
                </div>`;
            });
            document.getElementById('owned-trains-list').innerHTML = fleetHtml;

            let linesHtml = '';
            lines.forEach(l => {
                let availableTrains = trains.filter(t => !t.assignedLine);
                let selectOptions = availableTrains.map(t => `<option value="${t.id}">${t.model} (${t.id})</option>`).join('');

                linesHtml += `<div class="item-card" style="border-left: 5px solid ${l.color}">
                    <b>🗺️ ${l.name}</b>
                    <span style="font-size:11px; color:#aaa;">Zastávek: ${l.stops.length} | Vlaků: ${l.assignedTrains.length}</span>
                    <span style="font-size:11px; color:#aaa;">Trasa: ${l.stops[0].name} ➔ ${l.stops[l.stops.length - 1].name}</span>
                    
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <button class="action-btn" style="font-size:10px; background:#e67e22;" onclick="appendStopToLine(${l.id}, 'start')">➕ Na začátek</button>
                        <button class="action-btn" style="font-size:10px; background:#e67e22;" onclick="appendStopToLine(${l.id}, 'end')">➕ Na konec</button>
                    </div>

                    <div style="margin-top:6px; border-top: 1px solid #333; padding-top: 4px;">
                        ${availableTrains.length > 0 ? `
                            <select id="select-train-${l.id}" style="padding:4px; margin-top:4px; width:100%; background:#111; color:#fff; border:1px solid #444;">${selectOptions}</select>
                            <button class="action-btn" style="margin-top:4px; width:100%;" onclick="assignTrainToLine(document.getElementById('select-train-${l.id}').value, ${l.id})">➕ Nasadit zvolený vlak</button>
                        ` : '<span style="color:#aaa; font-size:10px;">Žádný volný vlak v depu</span>'}
                    </div>
                </div>`;
            });
            document.getElementById('lines-list').innerHTML = linesHtml;
        }

        function autoSave() {
            saveGame(true);
        }

        function saveGame(silent = false) {
            let saveData = {
                balance: balance,
                stops: stops.map(s => ({ id: s.id, name: s.name, latlng: s.latlng, passengers: s.passengers })),
                trackSegments: trackSegments.map(s => ({ id: s.id, start: s.start, end: s.end, isTunnel: s.isTunnel, cost: s.cost })),
                trains: trains.map(t => ({ id: t.id, model: t.model, speed: t.speed, capacity: t.capacity, img: t.img, assignedLine: t.assignedLine, distanceKm: t.distanceKm })),
                lines: lines.map(l => ({ id: l.id, name: l.name, color: l.color, stopsIds: l.stops.map(s => s.id), assignedTrains: l.assignedTrains }))
            };

            localStorage.setItem('ostrava_tram_train_save', JSON.stringify(saveData));
            if (!silent) alert("Hra byla úspěšně uložena!");
        }

        function loadGame() {
    let dataRaw = localStorage.getItem('ostrava_tram_train_save');
    if (!dataRaw) return alert("Žádná uložená pozice nebyla nalezena!");

    let data = JSON.parse(dataRaw);
    
    // Vyčištění starých prvků z mapy
    stops.forEach(s => map.removeLayer(s.marker));
    trackSegments.forEach(s => map.removeLayer(s.polyline));
    lines.forEach(l => { if (l.polyline) map.removeLayer(l.polyline); });
    trains.forEach(t => { if (t.marker) map.removeLayer(t.marker); });

    balance = data.balance;
    stops = [];
    trackSegments = [];
    lines = [];
    trains = [];

    // 1. NAČTENÍ ZASTÁVEK
    data.stops.forEach(s => {
        let marker = L.marker(s.latlng, { icon: L.divIcon({ className: 'stop-marker' }) }).addTo(map);
        marker.bindPopup('');

        let stopObj = { id: s.id, name: s.name, latlng: s.latlng, marker: marker, passengers: s.passengers || {} };
        stops.push(stopObj);
        
        marker.on('click', () => {
            if (isCreatingLine || extendingLine) {
                marker.closePopup();
                onStopClick(stopObj);
            } else {
                updateStopPopup(stopObj);
            }
        });

        updateStopPopup(stopObj);
    });

    // 2. NAČTENÍ KOLEJÍ
    data.trackSegments.forEach(s => {
        let polyline = L.polyline([s.start, s.end], {
            color: s.isTunnel ? '#9b59b6' : '#3498db',
            weight: s.isTunnel ? 4 : 5,
            dashArray: s.isTunnel ? '6, 6' : null
        }).addTo(map);

        let segObj = { id: s.id, start: s.start, end: s.end, polyline: polyline, isTunnel: s.isTunnel, cost: s.cost };
        trackSegments.push(segObj);
        
        polyline.on('click', () => {
            if (currentMode === 'demolish') demolishSegment(segObj);
        });

        addNodeMarker(s.start);
        addNodeMarker(s.end);
    });

    // 3. NAČTENÍ LINEK
    data.lines.forEach(l => {
        let lineStops = l.stopsIds.map(id => stops.find(s => s.id === id)).filter(Boolean);
        let calculatedPath = buildPathFromStops(lineStops);
        let linePolyline = L.polyline(calculatedPath, { color: l.color, weight: 6, opacity: 0.8 }).addTo(map);

        lines.push({
            id: l.id,
            name: l.name,
            color: l.color,
            stops: lineStops,
            path: calculatedPath,
            polyline: linePolyline,
            assignedTrains: []
        });
    });

    // 4. NAČTENÍ VLAKŮ
    data.trains.forEach(t => {
        let trainObj = {
            id: t.id,
            model: t.model,
            speed: t.speed,
            capacity: t.capacity,
            img: t.img,
            assignedLine: null,
            distanceKm: t.distanceKm || 0,
            passengersOnBoard: t.passengersOnBoard || [] // Obnovíme lidi uvnitř vlaku
        };
        trains.push(trainObj);

        if (t.assignedLine) {
            assignTrainToLine(trainObj.id, t.assignedLine);
        }
    });

    // 5. ROZPROSTŘENÍ VLAKŮ DO TAKTU PODLE LINEK
    lines.forEach(line => {
        distributeTrainsEvenlyOnLine(line.id);
    });

    setMode('select');
    updateUI();
    alert("Hra byla úspěšně načtena!");
}

        function resetGame() {
            if (confirm("Opravdu chceš smazat uloženou hru a začít od znova?")) {
                localStorage.removeItem('ostrava_tram_train_save');
                location.reload();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) autoSave();
        });

        setMode('select');
        updateUI();
    </script>
